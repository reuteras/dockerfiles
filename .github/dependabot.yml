---
version: 2
updates:
  - package-ecosystem: "docker" # zizmor: ignore[dependabot-cooldown]
    directory: "/marimo"
    schedule:
      interval: "daily"
    # cooldown omitted: Dependabot crashes (DockerRegistry2::NotFound) when
    # applying cooldown to python:3.14-bookworm due to a Docker Hub blob 404
    # Stay on Python 3.14: marimo[recommended] pulls loro, whose PyO3 does
    # not support 3.15 yet (the build fails). Remove when it does.
    ignore:
      - dependency-name: "python"
        versions: [">=3.15"]
    groups:
      package-deps:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/nDPI"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    groups:
      package-deps:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/nginx"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    groups:
      docker-nginx-deps:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/snort2suricata"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    groups:
      docker-snort-deps:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/zeek"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    groups:
      docker-zeek-deps:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/fq"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    groups:
      docker-fq-deps:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/hfinger"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    groups:
      docker-hfinger-deps:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    groups:
      actions-deps:
        patterns:
          - "*"

  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    groups:
      pre-commit-deps:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/.github/osv-scanner"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
